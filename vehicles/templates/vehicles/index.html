<!DOCTYPE html>
<html>

<head>
    <title>Vehicle ML Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .scrollspy-example {
            height: 80vh;
            overflow-y: scroll;
            position: relative;
        }

        .nav-pills .nav-link.active {
            background-color: #0d6efd;
        }
    </style>
</head>

<body>
    <div class="container-fluid mt-4">
        <div class="row">

            <!-- Sidebar Navigation -->
            <div class="col-md-3">
                <div id="dashboard-nav" class="list-group position-sticky top-0">
                    <a class="list-group-item list-group-item-action" href="#frequency-table">
                        Frequency Tables (One-way)
                    </a>
                    <a class="list-group-item list-group-item-action" href="#manufacturer-chart">
                        Vehicles per Manufacturer
                    </a>
                    <a class="list-group-item list-group-item-action" href="#price-chart">
                        Average Price
                    </a>
                </div>
            </div>

            <!-- Scrollable Content -->
            <div class="col-md-9">
                <div class="scrollspy-example" data-bs-spy="scroll" data-bs-target="#dashboard-nav"
                    data-bs-smooth-scroll="true" tabindex="0">

                    <h1 class="text-center text-primary mb-4">Vehicle Machine Learning Dashboard</h1>

                    <!-- Frequency Table -->
                    <div id="frequency-table" class="card shadow mb-5">
                        <div class="card-header bg-info text-white">
                            Frequency Tables (One-way)
                        </div>
                        <div class="card-body">
                            {{ frequency_table|safe }}
                        </div>
                    </div>

                    <!-- Manufacturer Chart -->
                    <div id="manufacturer-chart" class="card shadow mb-5">
                        <div class="card-header bg-info text-white">
                            Vehicles per Manufacturer
                        </div>
                        <div class="card-body">
                            {{ manufacturer_chart|safe }}
                        </div>
                    </div>

                    <!-- Average Price Chart -->
                    <div id="price-chart" class="card shadow mb-5">
                        <div class="card-header bg-info text-white">
                            Average Price per Manufacturer
                        </div>
                        <div class="card-body">
                            {{ price_chart|safe }}
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
